# Runs MusicService in Docker on http://localhost:5002, against the REAL Postgres
# database in the cluster (reached over Tailscale). This is live data: what you
# create or delete here is real.
#
# One-time setup (see README, "Running locally"):
#   copy .env.example to .env   (.env is in .gitignore, never commit it)
#   fill in the musicservice database password and the JWT signing key
#
#   docker compose up --build
#
# Database migrations do NOT run locally: ASPNETCORE_ENVIRONMENT=Development loads
# appsettings.Development.json, which sets Database:MigrateOnStartup to false.
# Schema changes reach the real database only through a deploy from main.
services:
  api:
    build: .                     # build the Dockerfile in this repo
    ports:
      - "5002:8080"             # your machine's port 5002 -> the app's port 8080 in the container
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Host and port default to the database's Tailscale address. .env can point
      # them at a kubectl port-forward instead (see .env.example).
      # The ":?" makes compose stop with this message when DB_PASSWORD is empty.
      ConnectionStrings__Default: "Host=${DB_HOST:-quiz-postgres.tail5a1bc5.ts.net};Port=${DB_PORT:-5432};Database=musicservice;Username=musicservice;Password=${DB_PASSWORD:?DB_PASSWORD is not set. Copy .env.example to .env and fill it in (see README)}"
      # The key UserService signs login tokens with, so its tokens are accepted here.
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is not set. Copy .env.example to .env and fill it in from OpenBao (see README)}"
      # Where the browser downloads song files from (the CDN in front of the bucket).
      BlobStorage__PublicBaseUrl: https://media.munkcloud.dk
    # Lets the container reach your own machine as "host.docker.internal",
    # used when DB_HOST points at a kubectl port-forward.
    extra_hosts:
      - "host.docker.internal:host-gateway"
