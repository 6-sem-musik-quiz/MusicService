# Runs the API against the REAL Postgres in the cluster (over Tailscale).
# This is live data: what you create or delete here is real.
#
# One-time setup (see README, "Running locally"):
#   copy .env.example to .env   (.env is in .gitignore, never commit it)
#   put the musicservice DB password and the JWT signing key in .env
#
#   docker compose up --build
#
# Compose stops with an error if DB_PASSWORD or JWT_SIGNING_KEY is missing or empty.
services:
  api:
    build: .
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=${DB_HOST:-quiz-postgres.tail5a1bc5.ts.net};Port=${DB_PORT:-5432};Database=musicservice;Username=musicservice;Password=${DB_PASSWORD:?DB_PASSWORD is not set. Copy .env.example to .env and fill it in (see README)}"
      # Never run migrations against the shared database from a local branch.
      # Schema changes reach the real database only through a deploy from main.
      Database__MigrateOnStartup: "false"
      # The key UserService signs tokens with, so tokens from it are accepted here.
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is not set. Copy .env.example to .env and fill it in from OpenBao (see README)}"
      BlobStorage__PublicBaseUrl: https://media.munkcloud.dk
    extra_hosts:
      - "host.docker.internal:host-gateway"
